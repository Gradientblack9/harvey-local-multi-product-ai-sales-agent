[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvey-local-sales"
version = "1.0.0"
description = "An offline, multi-product sales workspace powered by local Ollama inference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.121.3", "uvicorn==0.38.0", "httpx==0.28.1",
  "pydantic==2.12.4", "psutil==7.1.3", "sentence-transformers==5.1.2"
]

[project.optional-dependencies]
dev = ["pytest==9.0.1"]

[project.scripts]
harvey-local = "local_sales.cli:main"

[tool.setuptools.packages.find]
include = ["local_sales*"]

[tool.setuptools.package-data]
local_sales = ["web/*", "web/fonts/*"]
