name: Local sales tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install fastapi==0.121.3 uvicorn==0.38.0 httpx==0.28.1 pydantic==2.12.4 psutil==7.1.3 pytest==9.0.1
      - run: python -m pytest -q
      - run: node --check local_sales/web/app.js
